name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — ghrm
    runs-on: ubuntu-latest

    steps:
      # ── 1. Clone vbwd-backend ──────────────────────────────────────────────
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      # ── 2. Clone plugin directly into vbwd-backend/plugins/ghrm ────
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/ghrm

      # ── 2b. Clone subscription dependency (ghrm declares dependencies=[subscription]) ──
      - name: Clone subscription dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-subscription
          path: vbwd-backend/plugins/subscription

      # ── 2c. Clone cms peer (catalogue = CMS posts; tests import plugins.cms and
      #        read plugins/cms/docs/imports/widgets/ghrm-categories.json) ──
      - name: Clone cms dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-cms
          path: vbwd-backend/plugins/cms

      # ── 2d. Clone email (subscription declares dependencies=["email"]) ────
      # Without it PluginManager refuses to enable subscription — "Cannot
      # enable 'subscription': dependency 'email' is not enabled" — so ghrm
      # (which depends on subscription) never enables either, its blueprint
      # never mounts, and every ghrm route test asserts against 404.
      - name: Clone email dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-email
          path: vbwd-backend/plugins/email

      # ── 2e. Fail fast if the clone-set has drifted from what plugins declare ──
      # Reads PluginMetadata.dependencies over every plugin present (so the
      # transitive closure). A missing peer here would otherwise surface only
      # as dozens of opaque 404s in the test steps. Runtime deps only, no
      # `--for ghrm`: that would also demand marketplace, which ghrm soft-imports
      # on purpose and which is private (not clonable here).
      - name: Verify declared plugin dependencies are checked out
        working-directory: vbwd-backend
        run: |
          missing="$(python3 ci/missing_plugin_deps.py)"
          if [ -n "$missing" ]; then
            echo "::error::peer plugins declared but not cloned: $(echo $missing)"
            exit 1
          fi

      # ── 3. Style checks (black · flake8 · mypy) ───────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vbwd-backend/requirements.txt

      - name: Style check — Black
        run: |
          black --check --diff \
            vbwd-backend/plugins/ghrm/ \
            --exclude='/(\.git|\.github|__pycache__|\.pytest_cache)/'

      - name: Style check — Flake8
        run: |
          flake8 vbwd-backend/plugins/ghrm/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=.git,.github,__pycache__,.pytest_cache

      - name: Style check — Mypy
        run: |
          PLUGIN_SRC=vbwd-backend/plugins/ghrm/src
          if [ -d "$PLUGIN_SRC" ]; then
            # Non-blocking for plugins (matches the vbwd-backend matrix policy):
            # mypy follows imports into peer deps (e.g. subscription) and surfaces
            # their pre-existing type-debt, which must not fail ghrm's gate.
            mypy "$PLUGIN_SRC" \
              --ignore-missing-imports \
              --no-error-summary \
              --python-version=3.11 \
              || echo "::warning::mypy reported issues (non-blocking for plugins)"
          else
            echo "No src/ directory — skipping mypy."
          fi

      # ── 3b. Enable every cloned plugin BEFORE anything boots ──────────────
      # plugins/plugins.json is gitignored, so a fresh checkout has none and the
      # app falls back to plugins.json.dist, which lists neither subscription
      # nor ghrm. Writing the manifest up front (keyed by PluginMetadata.name)
      # means the api and the `test` container both boot with the cloned set
      # enabled, in dependency order.
      - name: Create plugins.json (enable all present plugins)
        working-directory: vbwd-backend
        run: python3 ci/write_plugins_manifest.py

      # ── 4. Start docker compose stack (API + postgres + redis) ────────────
      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      # ── 5. Install and activate plugin ────────────────────────────────────
      - name: Enable all present plugins
        working-directory: vbwd-backend
        # Belt and braces on top of the manifest written above. Enable by
        # PluginMetadata.name, not directory (they can differ, and a directory
        # key is silently ignored by the loader). Two passes: ghrm sorts before
        # its dependency subscription, so it can only enable on the second pass
        # if the manifest did not already enable it. enable is idempotent. The
        # exclude list still matches on the directory. `exec` reads stdin, so it
        # gets </dev/null or it would swallow the rest of the plugin list.
        run: |
          EXCLUDE_FILE="ci/plugins-enable-exclude.txt"
          for pass in 1 2; do
            while IFS=$'\t' read -r dir name; do
              [ -n "$dir" ] || continue
              if [ -f "$EXCLUDE_FILE" ] && grep -qxF "$dir" "$EXCLUDE_FILE"; then
                echo "Skipping CI-excluded plugin: $dir"; continue
              fi
              docker compose exec -T api flask --app "vbwd:create_app()" plugins enable "$name" </dev/null \
                && echo "Plugin $name enabled (pass $pass)." \
                || echo "Plugin $name already enabled or not registerable — continuing."
            done < <(python3 ci/plugin_names.py)
          done
      - name: Run unit tests
        working-directory: vbwd-backend
        run: |
          mkdir -p test-results
          if [ -d "plugins/ghrm/tests/unit" ]; then
            TESTS_DIR="plugins/ghrm/tests/unit/"
          elif [ -d "plugins/ghrm/tests" ]; then
            TESTS_DIR="plugins/ghrm/tests/"
            IGNORE="--ignore=plugins/ghrm/tests/integration/"
          else
            echo "No unit tests — skipping."
            exit 0
          fi
          docker compose --profile test run --rm -T test \
            pytest $TESTS_DIR ${IGNORE:-} \
            -v --tb=short \
            --junit-xml=/app/test-results/unit.xml

      # ── 7. Integration tests ───────────────────────────────────────────────
      - name: Run integration tests
        if: always()
        working-directory: vbwd-backend
        run: |
          if [ -d "plugins/ghrm/tests/integration" ]; then
            docker compose --profile test run --rm -T test \
              pytest plugins/ghrm/tests/integration/ \
              -v --tb=short \
              --junit-xml=/app/test-results/integration.xml
          else
            echo "No integration tests — skipping."
          fi

      # ── 8. Upload artifacts ────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ghrm-${{ github.run_number }}
          path: vbwd-backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ── 9. Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
